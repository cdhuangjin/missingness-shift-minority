# Project E Phase E3R: MAMR Safety Repair Gate (frozen, one-shot).
# This is the single pre-registered conservative repair of MAMR after the
# Phase E3 Method Gate returned HOLD (7/8, GO-C=False). The dataset / model /
# seed / environment grid is inherited unchanged from Phase E3. No method is
# replaced; MAMR is only re-configured more conservatively.

project: Project E Phase E3R MAMR Safety Repair Gate

datasets:
  - default_credit_card
  - bank_additional
  - htr2

models:
  - logistic_regression
  - xgboost

seeds:
  - 42
  - 52
  - 62

methods:
  - erm
  - class_weight
  - random_oversampling
  - missing_indicator
  - augmentation_only
  - exposure_weighting_only
  - uniform_minority_weight
  - original_mamr
  - safe_mamr

environments:
  - mcar_05
  - mcar_30
  - mcar_40
  - feature_specific
  - block_severe
  - cc_40
  - cc_50
  - reverse_cc_40

split:
  train: 0.60
  validation: 0.20
  test: 0.20

source_missingness:
  mechanism: mcar
  rate: 0.05

features:
  max_affected: 5
  rank_method: mutual_information

# The Phase E3 selected MAMR settings (the object of the repair).
original_mamr:
  lambda: 1.0
  copy_fraction: 0.25
  corruption_rate: 0.20

safety_search:
  # Only weaker-than-original settings are explored.
  step_a:
    copy_fraction: 0.15
    corruption_rate: 0.10
    lambda_candidates: [0.0, 0.10, 0.25, 0.50, 0.75]
  step_b:
    copy_fraction_candidates: [0.10, 0.15, 0.20, 0.25]
    corruption_rate_candidates: [0.05, 0.10, 0.15]
  hard_caps:
    lambda: 0.75
    copy_fraction: 0.25
    corruption_rate: 0.15
  # Pareto comparison set for the dataset x model cells (R10).
  pareto_candidates:
    - augmentation_only
    - exposure_weighting_only
    - uniform_minority_weight
    - original_mamr

validation_safety:
  alpha: 2.0
  beta: 1.0
  hard_majority_delta: -0.03
  hard_auprc_delta: -0.02
  stress_suite:
    - vmcar_20
    - vmcar_30
    - vfeature_mild
    - vblock_mild
    - vcc_mild
  global_feasible_fraction: 0.80

high_risk_mechanisms:
  - cc_40
  - cc_50
  - block_severe
  - feature_specific

control_mechanisms:
  - mcar_05
  - reverse_cc_40

statistics:
  bootstrap_iterations: 5000
  confidence_level: 0.95
  fdr_alpha: 0.05

# Safety Gate thresholds (R1-R10). These match the prompt's pre-registered
# numbers and are frozen here so the verdict is reproducible.
gate:
  r1_min_big_mean: 0.08
  r1_min_big_frac: 0.80
  r1_min_big_dataset: 0.05
  r1_min_datasets: 2
  r2_min_mgr: 0.60
  r3_min_majority_mean: -0.01
  r3_min_majority_worst: -0.03
  r4_min_auprc_mean: -0.005
  r4_min_auprc_worst: -0.02
  r5_min_iid_recall: -0.02
  r5_min_iid_auprc: -0.01
  r6_min_recall_drop: 0.10
  r6_min_lrr: 0.30
  r6_min_lrr_pos: 0.70
  r8_min_mas: 0.03
  r10_min_cells: 4
  go_min_pass: 8
  stop_mgr_min: 0.30
  stop_auprc_mean: -0.005
  stop_auprc_worst: -0.02
  stop_iid_recall: -0.02
  stop_iid_auprc: -0.01

paths:
  raw_data: data/raw
  processed_data: data/processed
  results: results/phase_e3r_mamr_safety
