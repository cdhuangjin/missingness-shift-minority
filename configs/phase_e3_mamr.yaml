# Project E Phase E3: MAMR Method Gate (frozen).
# This config is written before any Phase E3 experiment runs. The dataset list
# is fixed to the three Gate-A datasets with a clear minority vulnerability.
# Do not add or remove datasets after seeing results (§41).

project: Project E Phase E3 MAMR Method Gate

datasets:
  - default_credit_card
  - bank_additional
  - htr2

models:
  - logistic_regression
  - xgboost

seeds:
  - 42
  - 52
  - 62

methods:
  - erm
  - class_weight
  - random_oversampling
  - missing_indicator
  - augmentation_only
  - exposure_weighting_only
  - uniform_minority_weight
  - mamr_full

environments:
  - mcar_05
  - mcar_30
  - mcar_40
  - feature_specific
  - block_severe
  - cc_40
  - cc_50
  - reverse_cc_40

split:
  train: 0.60
  validation: 0.20
  test: 0.20

source_missingness:
  mechanism: mcar
  rate: 0.05

features:
  max_affected: 5
  rank_method: mutual_information

mamr:
  topk_features: 5
  lambda: 1.0
  lambda_candidates: [0.25, 0.5, 1.0, 2.0]
  selected_lambda: null
  augmentation:
    enabled: true
    minority_only: true
    copy_fraction: 0.5
    corruption_rate: 0.15
    minority_corruption_rate: 0.15
    majority_corruption_rate: 0.05
    copy_fraction_candidates: [0.25, 0.5]
    corruption_rate_candidates: [0.10, 0.15, 0.20]
    mechanism_mix:
      mcar: 0.4
      feature_specific: 0.3
      block: 0.3

# Phase E1/E2 risk ranking: cc_50, block_severe, cc_40, mcar_40, feature_specific,
# mcar_30... High-risk set is the exposure-driven failure set; control set is the
# IID reference + the reverse class-conditional control.
high_risk_mechanisms:
  - cc_40
  - cc_50
  - block_severe
  - feature_specific

control_mechanisms:
  - mcar_05
  - reverse_cc_40

statistics:
  bootstrap_iterations: 2000
  confidence_level: 0.95
  fdr_alpha: 0.05

# Method Gate thresholds (§23). The threshold constants are frozen here so the
# verdict is reproducible without re-deriving them from commentary.
gate:
  go_a_min_gain: 0.05
  go_a_min_datasets: 2
  go_b_min_lrr: 0.30
  go_b_min_positive_fraction: 0.70
  go_b_min_recall_drop: 0.10
  go_c_mean_minus: -0.01
  go_c_worst_minus: -0.03
  go_d_mean_minus: -0.005
  go_d_worst_minus: -0.02
  go_e_min_recall: -0.02
  go_e_min_auprc: -0.01
  go_f_min_mean: 0.0
  go_f_min_positive_fraction: 0.65
  go_g_min_mas: 0.03
  go_h_min_seed_fraction: 0.6667
  go_h_min_datasets: 2

paths:
  raw_data: data/raw
  processed_data: data/processed
  results: results/phase_e3_mamr
